<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AstraLearn{% endblock %}</title>
    <link rel="icon" href="https://www.google.com/s2/favicons?domain=tailwindcss.com&sz=32" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           Design tokens — change a value here, every component updates.
           ============================================================ */
        :root {
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;

            --accent: #4F46E5;        /* one accent color for this app */
            --accent-hover: #4338CA;
            --text-on-accent: #FFFFFF;

            --text-primary: #1E293B;   /* ~13.6:1 on white */
            --text-secondary: #475569; /* ~7.5:1 on white */

            --surface-0: #FFFFFF;
            --surface-1: #F8FAFC;
            --surface-2: #F1F5F9;

            --border-hairline: 1px solid rgba(15, 23, 42, 0.10);
            --shadow-soft: 0 12px 32px -8px rgba(15, 23, 42, 0.12);
            --shadow-soft-sm: 0 4px 12px -2px rgba(15, 23, 42, 0.08);

            --radius-outer: 16px;
            --radius-sm: 8px;

            --font-size-body: 16px;
            --line-height-body: 1.5;
            --measure: 70ch; /* ~60-75 characters per line */

            --focus-ring: 0 0 0 3px rgba(79, 70, 229, 0.35);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #F1F5F9;
                --text-secondary: #CBD5E1;
                /* Lifted surfaces, not an inverted light theme */
                --surface-0: #0F172A;
                --surface-1: #1E293B;
                --surface-2: #273449;
                --border-hairline: 1px solid rgba(255, 255, 255, 0.12);
            }
            body.bg-white, .bg-white { background: var(--surface-0) !important; color: var(--text-primary); }
            .bg-gray-50 { background: var(--surface-1) !important; }
            #sidebar.bg-white { background: var(--surface-0) !important; }
        }

        body { font-size: var(--font-size-body); line-height: var(--line-height-body); }
        p, li { max-width: var(--measure); }

        label, .form-label { font-weight: 700; color: var(--text-primary); }

        :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

        i.fas, i.far, i.fab { display: inline-flex; align-items: center; vertical-align: -0.1em; }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: var(--space-2) var(--space-4);
            font-size: 1rem;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: background-color 0.2s;
        }
        .sidebar-link:hover {
            background-color: var(--surface-1);
        }
        .sidebar-link.active {
            font-weight: 700;
            color: var(--accent);
            background-color: var(--surface-2);
        }

        /* One filled (accent) action per section; everything else stays quiet */
        .btn-filled {
            display: inline-flex; align-items: center; justify-content: center;
            gap: var(--space-2);
            background: var(--accent);
            color: var(--text-on-accent);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            padding: var(--space-2) var(--space-4);
            box-shadow: none;
            transition: background-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .btn-filled:hover { background: var(--accent-hover); box-shadow: var(--shadow-soft-sm); transform: translateY(-1px); }

        .btn-outline {
            display: inline-flex; align-items: center; justify-content: center;
            gap: var(--space-2);
            background: transparent;
            color: var(--accent);
            border: var(--border-hairline);
            border-radius: var(--radius-sm);
            font-weight: 600;
            padding: var(--space-2) var(--space-4);
        }
        .btn-outline:hover { background: var(--surface-1); }

        /* Cards: hairline border, soft big-blur shadow, inner radius = outer minus padding */
        .card-surface {
            background: var(--surface-0);
            border: var(--border-hairline);
            border-radius: var(--radius-outer);
            padding: var(--space-6);
        }
        .card-surface:hover { box-shadow: var(--shadow-soft); }

        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-6);
            color: var(--text-secondary);
        }
        .empty-state .empty-state-action { margin-top: var(--space-4); }

        /* Skeleton placeholder for content still generating in the background (Celery) */
        .skeleton-line {
            height: 14px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            margin-bottom: var(--space-3);
            animation: skeleton-pulse 1.4s ease-in-out infinite;
        }
        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        @media (prefers-reduced-motion: reduce) {
            .skeleton-line { animation: none; }
        }

        /* Custom Styles for lesson/markdown content */
        .prose h1, .prose h2, .prose h3 {
            color: var(--text-primary);
        }
        .prose p, .prose li {
            color: var(--text-secondary);
        }
        .prose code {
            background-color: var(--surface-2);
            color: var(--text-primary);
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            border-radius: var(--radius-sm);
        }
        .prose pre {
            background-color: var(--surface-1);
            border: var(--border-hairline);
            border-radius: var(--radius-outer);
            padding: var(--space-4);
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
        }
        .prose a {
            color: var(--accent);
            text-decoration: none;
        }
        .prose a:hover {
            text-decoration: underline;
        }

        /* Mobile sidebar styles */
        .mobile-sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-sidebar.open {
            transform: translateX(0);
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40;
        }
        .sidebar-overlay.active {
            display: block;
        }
    </style>
</head>
<body class="h-full bg-white">
    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

    <div class="flex h-full">
        <!-- Sidebar -->
        <div id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col p-4 mobile-sidebar md:relative md:translate-x-0 fixed top-0 left-0 h-full z-50">
            <div class="p-4 mb-4">
                <div class="flex items-center justify-between md:justify-start">
                    <a href="{% url 'tutor:course_list' %}">
                        <h1 class="text-3xl font-bold" style="color: var(--accent);">AstraLearn</h1>
                    </a>
                    <!-- Mobile close button -->
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            <div class="border rounded-lg p-2">
                {% block sidebar_content %}
                <nav class="space-y-1">
                    <a href="{% url 'tutor:dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                    </a>
                    <a href="{% url 'tutor:course_list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'course_list' or request.resolver_match.url_name == 'course_detail' %}active{% endif %}">
                        <i class="fas fa-book mr-2"></i>My Courses
                    </a>
                    <a href="{% url 'tutor:create_course_page' %}" class="sidebar-link {% if request.resolver_match.url_name == 'create_course_page' %}active{% endif %}">
                        <i class="fas fa-plus mr-2"></i>Create Course
                    </a>
                    <a href="http://localhost:3000" class="sidebar-link" target="_blank">
                        <i class="fas fa-robot mr-2"></i>AI Guru
                    </a>
                </nav>
                {% endblock %}
            </div>
        </div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Mobile header with hamburger menu -->
            <header class="bg-white border-b border-gray-200 md:hidden">
                <div class="flex items-center justify-between p-4">
                    <button onclick="toggleMobileSidebar()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">AstraLearn</h1>
                    <div class="w-8"></div> <!-- Spacer for centering -->
                </div>
            </header>

            <main class="flex-1 overflow-y-auto bg-gray-50">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Close sidebar when clicking outside on mobile
        document.getElementById('sidebar-overlay').addEventListener('click', function() {
            if (window.innerWidth < 768) {
                toggleMobileSidebar();
            }
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (window.innerWidth >= 768) {
                sidebar.classList.remove('mobile-sidebar', 'open');
                overlay.classList.remove('active');
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
