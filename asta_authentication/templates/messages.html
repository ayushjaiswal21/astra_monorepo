<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-built.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f2ef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
        .nav-icon:hover { color: #0a66c2; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/enhancements.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center space-x-2">
                    <div class="flex items-center">
                        <div class="w-9 h-9 rounded flex items-center justify-center" style="background: var(--accent);">
                            <i class="fas fa-graduation-cap text-white text-lg"></i>
                        </div>
                        <span class="ml-2 text-xl font-bold" style="color: var(--accent);">AstraLearn</span>
                    </div>
                </div>
                <nav class="flex items-center space-x-6">
                    <a href="{{ url_for('main.dashboard') }}" class="nav-icon flex flex-col items-center text-gray-600 hover:text-gray-900">
                        <i class="fas fa-home text-xl mb-1"></i>
                        <span class="text-xs font-medium">Home</span>
                    </a>
                    <a href="{{ url_for('main.network') }}" class="nav-icon flex flex-col items-center text-gray-600 hover:text-gray-900">
                        <i class="fas fa-user-friends text-xl mb-1"></i>
                        <span class="text-xs font-medium">People</span>
                    </a>
                    <a href="{{ url_for('main.internships') }}" class="nav-icon flex flex-col items-center text-gray-600 hover:text-gray-900">
                        <i class="fas fa-briefcase text-xl mb-1"></i>
                        <span class="text-xs font-medium">Internships</span>
                    </a>
                    <a href="{{ url_for('main.messages') }}" class="nav-icon flex flex-col items-center" style="color: var(--accent);">
                        <i class="fas fa-comment-dots text-xl mb-1"></i>
                        <span class="text-xs font-medium">Messages</span>
                    </a>
                    <a href="#" class="nav-icon flex flex-col items-center text-gray-600 hover:text-gray-900">
                        <i class="fas fa-bell text-xl mb-1"></i>
                        <span class="text-xs font-medium">Notifications</span>
                    </a>
                    <a href="{{ url_for('profile.view_profile', username=current_user.username) }}" class="nav-icon flex flex-col items-center text-gray-600 hover:text-gray-900">
                        <div class="w-6 h-6 rounded-full overflow-hidden">
                           <img src="{{ current_user.profile_pic_url or url_for('static', filename='images/dp.jpeg') }}" alt="User Profile" class="w-full h-full object-cover">
                        </div>
                        <span class="text-xs font-medium">Me</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex h-[calc(100vh-10rem)] bg-white rounded-lg shadow-lg">
            <!-- Start / switch chat -->
            <div class="w-1/3 border-r border-gray-200">
                <div class="p-4 border-b border-gray-200">
                    <h2 class="text-xl font-bold text-gray-900">Chats</h2>
                </div>
                <div class="p-4">
                    <label class="text-sm text-gray-600 block mb-2">Chat with (username)</label>
                    <div class="flex">
                        <input id="chat-target-input" type="text" placeholder="username"
                               class="flex-1 bg-gray-100 border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="openConversation()" class="text-white font-bold py-2 px-4 rounded-r-lg" style="background: var(--accent);">Open</button>
                    </div>
                    <p id="chat-target-error" class="text-sm text-red-600 mt-2"></p>
                </div>
            </div>

            <!-- Active Chat -->
            <div class="w-2/3 flex flex-col">
                <div class="p-4 border-b border-gray-200">
                    <h2 class="text-xl font-bold text-gray-900" id="active-chat-title">Select a chat</h2>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col space-y-2"></div>
                <div class="p-4 border-t border-gray-200">
                    <div class="flex">
                        <input id="message-input" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage();"
                               class="flex-1 bg-gray-100 border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="sendMessage()" class="text-white font-bold py-2 px-4 rounded-r-lg" style="background: var(--accent);">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
      // Mirrors the chat wiring in dashboard.html: connect to the '/chat'
      // namespace (chat_socket.py), persist via the existing
      // /api/messages/<username> HTTP API (which already emits
      // 'new_message' over that namespace), and render whatever lands.
      const socket = io("/chat");
      const currentUsername = "{{ current_user.username }}";
      let currentRecipient = null;

      function openConversation() {
        const input = document.getElementById("chat-target-input");
        const username = input.value.trim();
        const errorEl = document.getElementById("chat-target-error");
        errorEl.textContent = "";
        if (!username) return;

        fetch(`/api/messages/${encodeURIComponent(username)}`)
          .then((r) => {
            if (r.status === 404) { throw new Error("No user found with that username."); }
            return r.json();
          })
          .then((history) => {
            currentRecipient = username;
            document.getElementById("active-chat-title").textContent = username;
            const box = document.getElementById("chat-messages");
            box.innerHTML = "";
            history.forEach(displayMessage);
          })
          .catch((e) => { errorEl.textContent = e.message || "Could not open chat."; });
      }

      function sendMessage() {
        const input = document.getElementById("message-input");
        const content = input.value.trim();
        if (!content || !currentRecipient) return;
        input.value = "";
        displayMessage({ sender: currentUsername, content: content }); // optimistic

        const csrfMeta = document.querySelector('meta[name="csrf-token"]');
        fetch(`/api/messages/${encodeURIComponent(currentRecipient)}`, {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            csrfMeta ? { "X-CSRFToken": csrfMeta.content } : {}
          ),
          body: JSON.stringify({ content: content }),
        }).catch(() => {});
      }

      // Real-time delivery: server emits 'new_message' with sender_username.
      socket.on("new_message", function (data) {
        if (data.sender_username === currentRecipient) {
          displayMessage({ sender: data.sender_username, content: data.content });
        }
      });

      function displayMessage(message) {
        const box = document.getElementById("chat-messages");
        const isSent = message.sender === currentUsername;
        const row = document.createElement("div");
        row.className = isSent ? "flex justify-end" : "flex";
        const bubble = document.createElement("div");
        bubble.className = isSent
          ? "text-white p-3 rounded-lg max-w-xs"
          : "bg-gray-200 p-3 rounded-lg max-w-xs";
        if (isSent) bubble.style.background = "var(--accent)";
        const p = document.createElement("p");
        p.className = isSent ? "" : "text-gray-800";
        p.textContent = message.content;
        bubble.appendChild(p);
        row.appendChild(bubble);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }
    </script>
    <script src="{{ url_for('static', filename='js/site-chrome.js') }}" defer></script>
</body>
</html>
