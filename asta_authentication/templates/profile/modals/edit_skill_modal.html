<!-- Edit Skill Modal -->
<div class="modal fade" id="editSkillModal-{{ index }}" tabindex="-1" aria-labelledby="editSkillModalLabel-{{ index }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editSkillModalLabel-{{ index }}">Edit Skill</h5>
                <button type="button" class="text-lg leading-none opacity-60 hover:opacity-100" data-modal-dismiss aria-label="Close">&times;</button>
            </div>
            <form class="edit-skill-form" action="{{ url_for('profile.edit_skill', skill_index=index) }}" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="skillName-{{ index }}" class="form-label">Skill Name*</label>
                        <input type="text" class="form-control" id="skillName-{{ index }}" name="name" value="{{ skill.name }}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-modal-dismiss>Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('#editSkillModal-{{ index }} .edit-skill-form');
    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    },
                    body: new URLSearchParams(formData).toString()
                });
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    showToast('Server returned invalid JSON', 'error');
                    return;
                }
                if (response.ok && data && data.success) {
                    window.location.reload();
                } else {
                    showToast((data && (data.message || data.error)) || 'Failed to update skill', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('An error occurred while updating skill', 'error');
            }
        });
    }
});
</script>
