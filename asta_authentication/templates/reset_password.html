<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AstraLearn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-built.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/enhancements.css') }}">
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow-sm">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-indigo-600">AstraLearn</a>
            <div>
                 <a href="{{ url_for('auth.signin') }}" class="text-gray-600 hover:text-indigo-600 mr-4">Sign in</a>
                <a href="{{ url_for('auth.join') }}" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Join Now</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="max-w-7xl mx-auto px-6 py-12 flex justify-center">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Reset Password</h1>
                <p class="text-center text-gray-600 mb-6">Choose a new password for your account.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="mb-4 p-3 rounded text-sm {% if category == 'danger' %}bg-red-100 text-red-700{% else %}bg-indigo-50 text-indigo-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">New password</label>
                        <input type="password" id="password" name="password" minlength="6" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div class="mb-6">
                        <label for="confirm_password" class="block text-gray-700 text-sm font-bold mb-2">Confirm new password</label>
                        <input type="password" id="confirm_password" name="confirm_password" minlength="6" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-full focus:outline-none focus:shadow-outline">
                        Reset Password
                    </button>
                </form>
                 <div class="text-center mt-6">
                    <a href="{{ url_for('auth.signin_email') }}" class="inline-block align-baseline font-bold text-sm text-indigo-600 hover:text-indigo-800">
                        Back to sign in
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/site-chrome.js') }}" defer></script>
</body>
</html>
